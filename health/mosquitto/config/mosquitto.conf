# =============================================================================
# Mosquitto MQTT Broker Configuration — TLS-enabled (mTLS)
# =============================================================================

# ---------------------------------------------------------------------------
# Listeners
# ---------------------------------------------------------------------------

# TLS listener (port 8883) — main listener for production
listener 8883
protocol mqtt

# Unencrypted listener (port 1883) — uncomment only for local dev
# WARNING: Do NOT expose port 1883 in production
# listener 1883
# protocol mqtt

# ---------------------------------------------------------------------------
# Authentication & Authorization
# ---------------------------------------------------------------------------

allow_anonymous false
use_identity_as_username true

# Password file (supplementary when mTLS is active)
password_file /mosquitto/config/passwd

# ---------------------------------------------------------------------------
# TLS / mTLS Configuration
# ---------------------------------------------------------------------------

cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key

require_certificate true

# ---------------------------------------------------------------------------
# Queue & Flow Control
# ---------------------------------------------------------------------------

max_queued_messages   100
max_inflight_messages 20

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

# Log to stdout (Docker/Podman best practice)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
